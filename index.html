<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101214">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Monte sua divisão de treino, registre séries e cargas, acompanhe evolução e pesagens.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino">
<title>Diário de Treino</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/barlow-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
<script>
  /* aplica o tema salvo antes de desenhar a tela, sem piscar */
  try {
    var temaSalvo = localStorage.getItem('diario-treino-tema');
    if (!temaSalvo) { var dv = JSON.parse(localStorage.getItem('diario-treino-v1') || 'null'); temaSalvo = dv && dv.tema; }
    var claro = temaSalvo === 'claro' || (temaSalvo === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
    if (claro) {
      document.documentElement.setAttribute('data-tema', 'claro');
      document.querySelector('meta[name="theme-color"]').setAttribute('content', '#FFFFFF');
    }
  } catch (e) {}
</script>
</head>
<body>
<div class="shell com-nav">
  <nav id="nav" class="tabbar" aria-label="Navegação principal"></nav>
  <main id="view" class="view" tabindex="-1"></main>
</div>
<div id="sync" class="sync-chip" role="status" hidden></div>
<div id="overlay"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<noscript><p class="noscript">Ative o JavaScript para usar o Diário de Treino.</p></noscript>
<script src="graficos.js" defer></script>
<script src="balanca.js" defer></script>
<script src="app.js" defer></script>
<script type="module" src="nuvem.js"></script>
</body>
</html>
